<title>Fractions &#8212; Quiz 4e</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4ff;--surface:#fff;--surface2:#f0ecff;
  --ink:#1a1730;--ink2:#4a4568;--ink3:#9590b0;
  --border:#e2ddf5;--border2:#c8c0ee;
  --purple:#6c47ff;--purple-light:#ede8ff;--purple-mid:#b8a8ff;
  --teal:#00b8a9;--coral:#ff6b6b;--coral-light:#fff0f0;
  --amber:#ffb347;--green:#2ec48e;--green-light:#e6faf3;
  --radius:10px;--radius-lg:18px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Nunito',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 1rem 4rem;}
header{width:100%;max-width:700px;padding:2.5rem 0 2rem;text-align:center;}
.header-tag{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--purple);margin-bottom:.6rem;}
h1{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:800;line-height:1.1;margin-bottom:.5rem;}
h1 span{color:var(--purple);}
.header-sub{font-size:14px;color:var(--ink3);line-height:1.6;}
.tabs{width:100%;max-width:700px;display:flex;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap;}
.tab-btn{flex:1;min-width:140px;padding:.65rem .8rem;background:var(--surface);border:2px solid var(--border2);border-radius:var(--radius);font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:var(--ink3);cursor:pointer;transition:background .15s,border-color .15s,color .15s;display:flex;align-items:center;justify-content:center;gap:6px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.tab-btn.active{background:var(--purple);border-color:var(--purple);color:#fff;}
.tab-dot{width:8px;height:8px;border-radius:50%;}
.tab-btn.active .tab-dot{background:rgba(255,255,255,.5);}
.tab-dot.t1{background:var(--teal);}
.tab-dot.t2{background:var(--coral);}
.tab-dot.t3{background:var(--amber);}
.tab-dot.t4{background:var(--green);}
.prog-wrap{width:100%;max-width:700px;margin-bottom:1.5rem;}
.prog-meta{display:flex;justify-content:space-between;font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--ink3);margin-bottom:6px;}
.prog-track{height:6px;background:var(--border);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;background:var(--purple);border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1);}
.quiz-card{width:100%;max-width:700px;background:var(--surface);border:2px solid var(--border2);border-radius:var(--radius-lg);overflow:hidden;}
.card-top{padding:1.25rem 1.5rem 1rem;border-bottom:1.5px solid var(--border);}
.ctx-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:.4rem;}
.ctx-box{font-size:13px;color:var(--ink2);background:var(--surface2);border-radius:var(--radius);padding:10px 14px;border-left:3px solid var(--purple-mid);line-height:1.6;}
.card-body{padding:1.25rem 1.5rem;}
.q-num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--purple);letter-spacing:.06em;margin-bottom:.5rem;}
.q-text{font-size:1.1rem;font-weight:700;color:var(--ink);line-height:1.5;margin-bottom:1.25rem;}
/* fractions — inline-table is the most iOS-compatible approach */
.frac{display:inline-table;vertical-align:middle;margin:0 4px;text-align:center;border-collapse:collapse;line-height:1;}
.frac .num{display:table-row;text-align:center;font-weight:800;font-size:.88em;padding:0 4px;}
.frac .bar{display:table-row;}
.frac .bar b{display:table-cell;border-top:2.5px solid currentColor;padding:0 2px;}
.frac .den{display:table-row;text-align:center;font-weight:800;font-size:.88em;padding:0 4px;}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1.25rem;}
@media(max-width:480px){.choices{grid-template-columns:1fr;}}
.choice{background:var(--surface2);border:2px solid var(--border2);border-radius:var(--radius);padding:12px 10px;font-size:16px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;text-align:center;transition:background .12s,border-color .12s;display:flex;align-items:center;justify-content:center;min-height:58px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.choice:active:not(:disabled){background:var(--purple-light);border-color:var(--purple-mid);}
.choice:disabled{cursor:default;}
.choice.correct{background:var(--green-light);border-color:var(--green);color:#1a6b4a;}
.choice.wrong{background:var(--coral-light);border-color:var(--coral);color:#9b2335;text-decoration:line-through;opacity:.75;}
.feedback{border-radius:var(--radius);padding:12px 14px;font-size:13px;line-height:1.7;margin-bottom:1.25rem;display:none;}
.feedback.show{display:block;}
.feedback.ok{background:var(--green-light);border:1.5px solid var(--green);color:#1a6b4a;}
.feedback.ko{background:var(--coral-light);border:1.5px solid var(--coral);color:#9b2335;}
.fb-head{font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:6px;font-size:13px;}
.fb-badge{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;}
.fb-badge.ok{background:var(--green);color:#fff;}
.fb-badge.ko{background:var(--coral);color:#fff;}
.reflex{background:rgba(108,71,255,.08);border-left:2px solid var(--purple);border-radius:0 var(--radius) var(--radius) 0;padding:8px 12px;font-size:12.5px;color:var(--purple);line-height:1.6;margin-top:8px;font-weight:600;}
.next-btn{background:var(--purple);color:#fff;border:none;border-radius:var(--radius);padding:11px 26px;font-family:'Nunito',sans-serif;font-size:16px;font-weight:800;cursor:pointer;display:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.next-btn.show{display:inline-block;}
.score-screen{width:100%;max-width:700px;display:none;}
.score-screen.show{display:block;}
.score-hero{background:var(--surface);border:2px solid var(--border2);border-radius:var(--radius-lg);padding:2.5rem 2rem;text-align:center;margin-bottom:1.25rem;}
.score-num{font-size:5rem;font-weight:800;line-height:1;margin-bottom:.4rem;color:var(--purple);}
.score-denom{font-size:3rem;font-weight:800;color:var(--ink3);}
.score-msg{font-size:15px;color:var(--ink3);max-width:380px;margin:.5rem auto 1.5rem;line-height:1.6;}
.score-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.btn-restart{background:transparent;color:var(--ink);border:2px solid var(--border2);border-radius:var(--radius);padding:10px 22px;font-family:'Nunito',sans-serif;font-size:16px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.btn-next-op{background:var(--teal);color:#fff;border:none;border-radius:var(--radius);padding:10px 22px;font-family:'Nunito',sans-serif;font-size:16px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.recap{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;}
.recap-item{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:10px 12px;display:flex;align-items:flex-start;gap:8px;}
.rdot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.rdot.ok{background:var(--green);}
.rdot.ko{background:var(--coral);}
.rq{font-size:12px;color:var(--ink3);line-height:1.4;}
.rq strong{color:var(--ink);display:block;font-size:13px;margin-bottom:1px;}
</style>
</head>

    <div class="feedback" id="feedback">

    <button class="next-btn" id="next-btn" onclick="nextQ()">Question suivante &#8594;</button>

</div>

<div class="score-screen" id="score-screen">

<script>
// Pure ASCII JS - no unicode chars in this block
var opIdx=0,current=0,score=0,results=[],answered=false;
var OPS=[];

function frac(n,d){
  return '<span class="frac"><span class="num">'+n+'</span><span class="bar"><b></b></span><span class="den">'+d+'</span></span>';
}

function parseFracs(s){
  // Replace {n/d} tokens with HTML fractions
  return s.replace(/\{(\d+)\/(\d+)\}/g,function(m,n,d){return frac(n,d);});
}

function loadData(){
  try{
    var raw=JSON.parse(document.getElementById('qdata').textContent);
    OPS=raw;
  }catch(e){
    console.error('Data parse error',e);
  }
}

function switchOp(idx,btn){
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  opIdx=idx; current=0; score=0; results=[]; answered=false;
  document.getElementById('score-screen').className='score-screen';
  document.getElementById('quiz-card').style.display='block';
  document.getElementById('prog-wrap').style.display='block';
  loadQ();
}

function loadQ(){
  answered=false;
  var op=OPS[opIdx],q=op.questions[current];
  document.getElementById('q-ctx').innerHTML=parseFracs(q.ctx);
  document.getElementById('q-num').textContent='Question '+(current+1)+' sur '+op.questions.length;
  document.getElementById('q-text').innerHTML=parseFracs(q.q);
  document.getElementById('feedback').className='feedback';
  document.getElementById('next-btn').className='next-btn';
  var cc=document.getElementById('choices');
  cc.innerHTML='';
  q.choices.forEach(function(c,i){
    var b=document.createElement('button');
    b.className='choice';
    b.innerHTML=parseFracs(c);
    b.setAttribute('onclick','answer('+i+')');
    cc.appendChild(b);
  });
  updateProg();
  var card=document.getElementById('quiz-card');
  card.style.transition='none';
  card.style.opacity='0';
  requestAnimationFrame(function(){
    card.style.transition='opacity .2s ease';
    card.style.opacity='1';
  });
}

function answer(idx){
  if(answered)return;
  answered=true;
  var q=OPS[opIdx].questions[current];
  var btns=document.querySelectorAll('.choice');
  btns.forEach(function(b){b.disabled=true;});
  var ok=(idx===q.correct);
  results.push(ok);
  if(ok)score++;
  btns[q.correct].className='choice correct';
  if(!ok)btns[idx].className='choice wrong';
  var fb=document.getElementById('feedback');
  var badge=document.getElementById('fb-badge');
  badge.textContent=ok?'V':'X';
  badge.className='fb-badge '+(ok?'ok':'ko');
  document.getElementById('fb-head').textContent=ok?'Bonne r\u00e9ponse !':'Pas tout \u00e0 fait.';
  document.getElementById('fb-body').innerHTML=parseFracs(ok?q.ok:q.ko);
  var ref=document.getElementById('fb-reflex');
  if(q.reflex){ref.innerHTML='\u{1F4A1} '+parseFracs(q.reflex);ref.style.display='block';}
  else{ref.style.display='none';}
  fb.className='feedback show '+(ok?'ok':'ko');
  var nb=document.getElementById('next-btn');
  nb.textContent=(current<OPS[opIdx].questions.length-1)?'Question suivante \u2192':'Voir mon score';
  nb.className='next-btn show';
  updateProg();
}

function nextQ(){
  current++;
  if(current>=OPS[opIdx].questions.length){showScore();return;}
  loadQ();
}

function updateProg(){
  var total=OPS[opIdx].questions.length;
  document.getElementById('prog-label').textContent='Question '+Math.min(current+1,total)+' / '+total;
  document.getElementById('prog-score').textContent=score+' bonne(s)';
  document.getElementById('prog-fill').style.width=Math.round(results.length/total*100)+'%';
}

function showScore(){
  document.getElementById('quiz-card').style.display='none';
  document.getElementById('prog-wrap').style.display='none';
  var msgs=[
    'A retravailler. Relis la r\u00e8gle et recommence.',
    'Des lacunes. Recommence en lisant les feedbacks.',
    'En bonne voie ! Encore quelques automatismes \u00e0 ancrer.',
    'Tr\u00e8s bien ! Les r\u00e9flexes sont presque l\u00e0.',
    'Parfait ! Tu ma\u00eetrises cette op\u00e9ration.'
  ];
  var mi=score<=2?0:score<=4?1:score<=6?2:score<=8?3:4;
  var total=OPS[opIdx].questions.length;
  document.getElementById('score-num').textContent=score;
  document.getElementById('score-denom').textContent=' / '+total;
  document.getElementById('score-msg').textContent=msgs[mi];
  var nextOp=document.getElementById('btn-next-op');
  if(opIdx<OPS.length-1){
    nextOp.textContent='Passer \u00e0 : '+OPS[opIdx+1].label+' \u2192';
    nextOp.style.display='inline-block';
  }else{
    nextOp.style.display='none';
  }
  var recap=document.getElementById('recap');
  recap.innerHTML='';
  OPS[opIdx].questions.forEach(function(q,i){
    var d=document.createElement('div');
    d.className='recap-item';
    var dot='<div class="rdot '+(results[i]?'ok':'ko')+'"></div>';
    var txt='<div class="rq"><strong>Q'+(i+1)+'</strong>'+q.q.replace(/\{[^}]+\}/g,'(...)').replace(/&[^;]+;/g,'').substring(0,45)+'...</div>';
    d.innerHTML=dot+txt;
    recap.appendChild(d);
  });
  document.getElementById('score-screen').className='score-screen show';
}

function restart(){
  current=0;score=0;results=[];answered=false;
  document.getElementById('quiz-card').style.display='block';
  document.getElementById('prog-wrap').style.display='block';
  document.getElementById('score-screen').className='score-screen';
  loadQ();
}

function goNextOp(){
  if(opIdx>=OPS.length-1)return;
  opIdx++;
  document.querySelectorAll('.tab-btn').forEach(function(b,i){
    b.classList.toggle('active',i===opIdx);
  });
  current=0;score=0;results=[];answered=false;
  document.getElementById('quiz-card').style.display='block';
  document.getElementById('prog-wrap').style.display='block';
  document.getElementById('score-screen').className='score-screen';
  loadQ();
}

loadData();
loadQ();
</script>
</body>
</html>
